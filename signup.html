<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

            font-family: "poppins",sans-serif;

     </style>

<body class="font-poppins">
    
    <!--login-->
<div class="flex flex-col items-center justify-center min-h-screen"
    style="background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2560&auto=format&fit=crop');">
    <div class="m-2 w-full max-w-sm flex flex-col p-6 bg-gray-300 rounded-[10px] shadow-xl hover:scale-105 hover:shadow-2xl transtion duration-400">
        <p class="text-2xl mb-2">Sign Up</p>
    <form action="main.html" >   
        <div class="flex flex-col mb-2">
            <label for="Email">Email:</label>
            <input type="email" placeholder="Email" class="border-1 p-1 rounded focus:outline-none">
        </div>
         <div class="flex flex-col mb-2">
            <label for="Password">Password:</label>
            <input type="password" placeholder="Password" class="border-1 p-1 rounded focus:outline-none">
        </div>
        <button class="bg-gray-900 text-white rounded w-full p-1 mt-2
         cursor-pointer mb-2">
          Sign Up
        </button>
        <p class="text-center">Already have an account? <a href="index.html" class="text-blue-700 hover:underline">Login</a></p>
    </form>     
    </div>
   </div>
